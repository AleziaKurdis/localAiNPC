<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="desktop.css">
    </head>
    <body>
        <div id="viewport">
            <table style="width:100%; border-collapse: collapse;">
                <tr class="chat">
                    <td colspan="2">
                        <div id="chat"></div>
                    </td>
                </tr>
                <tr class="typingBar">
                    <td style="text-align: left; width: 300px;">
                        <div class="wrapper">
                            <textarea id="inputUser" onblur="closeKeyboard();" onkeydown="handleKey(event);"></textarea>
                            <span id="prefocus" onclick="raiseKeyboard();"></span>
                        </div>
                    </td>
                    <td style="text-align: center;">
                        <span id="emitBtn" onClick="emit();">&#11165;</span><br>
                        <label id="enterOptLabel"><input id="enterOpt" type="checkbox" checked>ENTER</label>
                    </td>
                </tr>
            </table>
        </div>
    </body>
    <script src="residentChatHTML.js"></script>
</html>
